name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want to see added or changed?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: Why would this be useful?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Mockups, examples, or anything else relevant.